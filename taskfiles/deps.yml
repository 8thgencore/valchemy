version: '3'

tasks:
  install:global:
    desc: Install global development dependencies
    vars:
      TOOLS:
        - github.com/air-verse/air@latest
        - github.com/pressly/goose/v3/cmd/goose@latest
        - mvdan.cc/gofumpt@latest
        - github.com/yoheimuta/protolint/cmd/protolint@latest
    cmds:
      - for: { var: TOOLS }
        cmd: go install {{.ITEM}}
      - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.13.2
